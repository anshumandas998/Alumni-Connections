<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0B132B" />
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="30%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="cap-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="gold-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#F59E0B" flood-opacity="0.35" />
    </filter>
    <filter id="node-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#38BDF8" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" />
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="url(#gold-grad)" stroke-width="6" stroke-opacity="0.25" />

  <!-- Network Constellation Lines (Connecting Alumni) -->
  <g stroke="url(#cyan-glow)" stroke-width="4" stroke-opacity="0.4" stroke-linecap="round">
    <line x1="120" y1="360" x2="200" y2="410" />
    <line x1="200" y1="410" x2="312" y2="410" />
    <line x1="312" y1="410" x2="392" y2="360" />
    <line x1="200" y1="410" x2="256" y2="340" />
    <line x1="312" y1="410" x2="256" y2="340" />
    <line x1="120" y1="360" x2="256" y2="340" />
    <line x1="392" y1="360" x2="256" y2="340" />
  </g>

  <!-- Constellation Nodes (Alumni Points) -->
  <circle cx="120" cy="360" r="14" fill="#38BDF8" filter="url(#node-glow)" />
  <circle cx="120" cy="360" r="7" fill="#FFFFFF" />

  <circle cx="200" cy="410" r="16" fill="url(#gold-grad)" />
  <circle cx="200" cy="410" r="8" fill="#FFFFFF" />

  <circle cx="312" cy="410" r="16" fill="url(#gold-grad)" />
  <circle cx="312" cy="410" r="8" fill="#FFFFFF" />

  <circle cx="392" cy="360" r="14" fill="#38BDF8" filter="url(#node-glow)" />
  <circle cx="392" cy="360" r="7" fill="#FFFFFF" />

  <circle cx="256" cy="340" r="18" fill="url(#gold-grad)" filter="url(#gold-shadow)" />
  <circle cx="256" cy="340" r="9" fill="#FFFFFF" />

  <!-- Graduation Cap Under Skullcap -->
  <path d="M 186 230 Q 256 265 326 230 L 326 270 Q 256 315 186 270 Z" fill="url(#gold-grad)" />

  <!-- Graduation Mortarboard Rhombus Top -->
  <g filter="url(#gold-shadow)">
    <polygon points="256,95 435,185 256,260 77,185" fill="url(#gold-grad)" />
    <!-- Inner diamond highlight -->
    <polygon points="256,115 410,185 256,245 102,185" fill="#0F172A" fill-opacity="0.15" />
  </g>

  <!-- Center Button -->
  <ellipse cx="256" cy="180" rx="16" ry="12" fill="#FEF08A" />

  <!-- Cap Tassel Hanging Left/Down -->
  <path d="M 256 180 Q 295 190 325 210 Q 355 235 365 295" fill="none" stroke="#FDE68A" stroke-width="7" stroke-linecap="round" />
  <!-- Tassel Ribbon & Brush -->
  <ellipse cx="365" cy="295" rx="7" ry="5" fill="#F59E0B" />
  <path d="M 358 300 L 372 300 L 377 345 L 353 345 Z" fill="url(#gold-grad)" />
  <line x1="354" y1="345" x2="376" y2="345" stroke="#FEF08A" stroke-width="3" stroke-linecap="round" />
</svg>
